# Opens one overlay from the "Overlays" page, screenshots it and closes it with the device back action.
# env: BUTTON (button label), NAME (screenshot name), WAIT (text shown in the overlay)
appId: ${APP_ID || "international.idems.debug_app"}
---
- scrollUntilVisible:
    element: ${BUTTON}
    direction: DOWN
    centerElement: true
- tapOn: ${BUTTON}
- extendedWaitUntil:
    visible: ${WAIT}
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: ${NAME}
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Close popup"
          optional: true
      - tapOn:
          text: "Close"
          optional: true
      - tapOn:
          text: "Click here to skip!"
          optional: true
      # The combo box modal closes when an option is chosen
      - tapOn:
          text: "Option 1"
          optional: true
- waitForAnimationToEnd
